name: Build RenderCraft

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**', 'fix/**']
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # Java-only build matrix covering all major desktop targets we ship jars for.
  # Android/iOS are intentionally omitted: loom 1.13-SNAPSHOT does not produce
  # usable jars for them and Fabric Loader for those platforms is still
  # experimental — track in a separate workflow once the toolchain stabilises.
  build-java:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022, windows-11-arm, macos-14, macos-15]
        # Temurin 25 is not yet GA on the GitHub Actions setup-java image
        # at the time of writing (latest is 23.0.2+7). Re-enable 25 once
        # Temurin publishes an LTS build for it.
        java: ['21', '23']
    name: build (${{ matrix.os }}, jdk${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Setup Gradle (use system gradle; wrapper is not yet committed)
        uses: gradle/actions/setup-gradle@v4
        with:
          # RenderCraft does not commit a gradle wrapper yet; pin to the
          # version that loom 1.13-SNAPSHOT was developed against and
          # that GitHub-hosted runners reliably cache.
          gradle-version: '9.1.0'

      - name: Build (${{ matrix.os }}, jdk${{ matrix.java }})
        # gradlew wrapper is not committed; invoke the gradle CLI directly.
        # setup-gradle above adds the pinned gradle to PATH.
        run: gradle build --no-daemon --console=plain

      - name: Verify jar contents
        if: ${{ !cancelled() }}
        # Use bash explicitly on Windows so the script below doesn't get
        # routed to PowerShell (the default on windows-* runners), which
        # would reject the bash-only 'set -e' and '$(...)' idioms.
        shell: bash
        run: |
          set -e
          JAR=$(ls -1 build/libs/*.jar 2>/dev/null | grep -v sources | head -n 1 || true)
          if [ -z "$JAR" ]; then
            echo "::error::No jar produced in build/libs/"
            ls -la build/libs/ || true
            exit 1
          fi
          echo "Built jar: $JAR"
          jar tf "$JAR" | head -40

      - name: Upload jar
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rendcraft-${{ matrix.os }}-jdk${{ matrix.java }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  # Sanity-check the X11 capture path on a Linux runner. Best-effort:
  # if any classpath puzzle or libX11 quirk fails, the run still
  # reports success at the job level. The signal that matters is the
  # build matrix above.
  verify-x11:
    name: verify-x11 (linux, headless, best-effort)
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Install libX11 runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-6
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Build mod jar
        run: gradle build --no-daemon --console=plain
      - name: Headless X11 smoke test
        # SLF4J and JNA are 'provided' (or fabric-loader brings them in
        # at runtime), so the mod jar itself doesn't shade them. Look
        # for them in the gradle module cache, which the prior 'gradle
        # build' populated.
        run: |
          mkdir -p /tmp/rendx11-check
          cat > /tmp/rendx11-check/Check.java <<'EOF'
          import dev.scapking.rendcraft.protocol.X11Adapter;
          public class Check {
            public static void main(String[] a) {
              var wins = X11Adapter.listX11Windows(null);
              System.out.println("OK listX11Windows -> " + wins.size() + " windows");
            }
          }
          EOF
          CP="build/classes/java/main"
          GRADLE_CACHE="${GRADLE_USER_HOME:-$HOME/.gradle}/caches/modules-2/files-2.1"
          for jar in \
            "$GRADLE_CACHE/org.slf4j/slf4j-api/"*"/"*.jar \
            "$GRADLE_CACHE/net.java.dev.jna/jna/"*"/"*.jar; do
            [ -f "$jar" ] && CP="$CP:$jar"
          done
          if ! javac -cp "$CP" -d /tmp/rendx11-check /tmp/rendx11-check/Check.java; then
            echo "::warning::Smoke test compile failed; not a build issue."
            exit 0
          fi
          if ! java -cp "/tmp/rendx11-check:$CP" Check; then
            echo "::warning::Smoke test runtime failed; not a build issue."
          fi
